server {
    listen 80 default_server;
    server_name demo3d.llamkaydigitals.com;
    root /srv/demo3d;
    index index.html;
    location = / { try_files /index.html =404; }
    location = /index.html { try_files $uri =404; }
    location / { return 404; }
}

server {
    listen 80;
    server_name arm.llamkaydigitals.com;
    root /srv/arm;
    index index.html;
    location = / { try_files /index.html =404; }
    location = /index.html { try_files $uri =404; }
    location /assets/ { try_files $uri =404; }
    location / { return 404; }
}
